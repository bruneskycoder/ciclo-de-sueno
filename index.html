<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Etiquetas PWA para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Ciclos de Sueño</title>
    
    <style>
        /* Arquitectura Responsive: Variables fluidas y Flexbox */
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --border: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            /* Padding adaptable: menor en móviles pequeños, mayor en pantallas anchas */
            padding: 5vw 4vw; 
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        .app-container {
            width: 100%;
            max-width: 500px; /* Limita el ancho en tablets/PCs, pero ocupa el 100% en celulares */
        }
        
        /* Tarjeta del Contador Semanal */
        .stats-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }
        .stats-card h2 { margin: 0; font-size: 16px; color: var(--text-muted); }
        .stats-card .hours { font-size: 36px; font-weight: bold; color: var(--accent); margin: 8px 0; }
        .stats-card button {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
        }

        h1 { font-size: 28px; margin-bottom: 8px; text-align: center; }
        p.subtitle { color: var(--text-muted); margin-top: 0; margin-bottom: 24px; text-align: center; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab-btn {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        input[type="time"], input[type="number"] {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        
        .calc-btn {
            width: 100%;
            padding: 18px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 8px;
            cursor: pointer;
        }
        
        .results-box {
            margin-top: 24px;
            background: var(--bg-card);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            overflow-x: auto; /* Permite scroll horizontal en pantallas minúsculas si es necesario */
        }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 12px 4px; border-bottom: 1px solid var(--border); }
        th { color: var(--text-muted); font-size: 13px; font-weight: 500; }
        tr:last-child td { border-bottom: none; }
        
        .optimal { background-color: rgba(16, 185, 129, 0.1); font-weight: bold; }
        
        .save-btn {
            background-color: var(--success);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- MÓDULO NUEVO: Panel de Estadísticas Semanales -->
        <div class="stats-card">
            <h2>Horas dormidas (Últimos 7 días)</h2>
            <div class="hours" id="weekly-hours">0h 0m</div>
            <button onclick="limpiarHistorial()">Reiniciar Contador</button>
        </div>

        <h1>Ciclos de Sueño</h1>
        <p class="subtitle">Optimiza tu descanso (Ciclos de 90 min)</p>

        <!-- Selector de Modo -->
        <div class="tabs">
            <button id="wake-tab" class="tab-btn active" onclick="setMode('wake')">Despertar</button>
            <button id="sleep-tab" class="tab-btn" onclick="setMode('sleep')">Dormir</button>
        </div>

        <!-- Controles -->
        <div class="input-group">
            <label id="time-label">Me quiero despertar a las:</label>
            <input type="time" id="time-input" required>
        </div>

        <div class="input-group">
            <label>Minutos que tardo en dormirme:</label>
            <input type="number" id="latency-input" value="20" min="0" max="120">
        </div>

        <button class="calc-btn" onclick="calcularCiclos()">Calcular Horarios</button>

        <!-- Resultados -->
        <div id="results-table" class="results-box hidden">
            <table>
                <thead>
                    <tr>
                        <th>Ciclos</th>
                        <th>Horas</th>
                        <th>Hora Sugerida</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <!-- Javascript inyecta las filas aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- MÓDULO DE ALMACENAMIENTO (LocalStorage) ---
        // Por qué: Usamos localStorage para guardar datos en el celular del usuario sin usar internet.
        
        function cargarHistorial() {
            // Obtenemos los datos guardados o creamos un array vacío si es la primera vez
            const historial = JSON.parse(localStorage.getItem('historialSueno')) || [];
            
            // Filtramos solo los registros de los últimos 7 días (magia de milisegundos)
            const hace7Dias = new Date().getTime() - (7 * 24 * 60 * 60 * 1000);
            const historialReciente = historial.filter(registro => registro.fecha >= hace7Dias);
            
            // Sumamos los minutos
            let totalMinutos = 0;
            historialReciente.forEach(registro => {
                totalMinutos += registro.minutos;
            });

            // Convertimos a horas y minutos para mostrar en pantalla
            const horas = Math.floor(totalMinutos / 60);
            const minutos = totalMinutos % 60;
            document.getElementById('weekly-hours').innerText = `${horas}h ${minutos}m`;
            
            // Guardamos el array limpio (sin datos viejos)
            localStorage.setItem('historialSueno', JSON.stringify(historialReciente));
        }

        function registrarSueno(minutosDormidos) {
            const historial = JSON.parse(localStorage.getItem('historialSueno')) || [];
            // Guardamos la fecha actual (timestamp) y los minutos que durmió
            historial.push({
                fecha: new Date().getTime(),
                minutos: minutosDormidos
            });
            localStorage.setItem('historialSueno', JSON.stringify(historial));
            
            cargarHistorial(); // Actualizamos la pantalla
            alert("¡Descanso registrado con éxito en tu semana!");
        }

        function limpiarHistorial() {
            if(confirm("¿Seguro que quieres borrar tu registro semanal?")) {
                localStorage.removeItem('historialSueno');
                cargarHistorial();
            }
        }

        // --- MÓDULO DE CÁLCULOS UI ---
        function setMode(mode) {
            const wakeTab = document.getElementById('wake-tab');
            const sleepTab = document.getElementById('sleep-tab');
            const timeLabel = document.getElementById('time-label');

            if (mode === 'wake') {
                wakeTab.classList.add('active');
                sleepTab.classList.remove('active');
                timeLabel.textContent = 'Me quiero despertar a las:';
            } else {
                sleepTab.classList.add('active');
                wakeTab.classList.remove('active');
                timeLabel.textContent = 'Me acuesto a las:';
            }
            document.getElementById('results-table').classList.add('hidden');
        }

        function calcularCiclos() {
            const isWakeUp = document.getElementById('wake-tab').classList.contains('active');
            const timeInput = document.getElementById('time-input').value;
            const latencyInput = parseInt(document.getElementById('latency-input').value) || 20;
            const tbody = document.getElementById('results-body');
            const resultsTable = document.getElementById('results-table');

            if (!timeInput) return alert('Por favor, ingresa una hora válida.');

            const [hours, minutes] = timeInput.split(':').map(Number);
            const baseDate = new Date();
            baseDate.setHours(hours, minutes, 0, 0);

            tbody.innerHTML = '';
            resultsTable.classList.remove('hidden');

            for (let i = 1; i <= 6; i++) {
                const sleepDurationMins = i * 90;
                const targetDate = new Date(baseDate);

                if (isWakeUp) {
                    targetDate.setMinutes(targetDate.getMinutes() - sleepDurationMins - latencyInput);
                } else {
                    targetDate.setMinutes(targetDate.getMinutes() + sleepDurationMins + latencyInput);
                }

                const formatTime = (date) => {
                    return date.getHours().toString().padStart(2, '0') + ':' +
                           date.getMinutes().toString().padStart(2, '0');
                };

                const totalMinsInBed = sleepDurationMins + latencyInput;
                const inBedHours = Math.floor(totalMinsInBed / 60);
                const inBedMins = totalMinsInBed % 60;
                const inBedText = `${inBedHours}h ${inBedMins}m`;

                const row = document.createElement('tr');
                if (i >= 4 && i <= 6) row.classList.add('optimal');

                // Agregamos un botón a cada fila que llama a registrarSueno() con los minutos correspondientes
                row.innerHTML = `
                    <td>${i}</td>
                    <td>${inBedText}</td>
                    <td style="font-size: 16px; font-weight: bold;">${formatTime(targetDate)}</td>
                    <td>
                        <button class="save-btn" onclick="registrarSueno(${totalMinsInBed})">+ Sumar</button>
                    </td>
                `;
                tbody.appendChild(row);
            }
        }

        // Ejecutar al cargar la página para mostrar el historial guardado
        window.onload = cargarHistorial;
    </script>
</body>
</html>
