<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Etiquetas PWA para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Reposo del Guerrero</title>
    
    <!-- Tipografía Pixel Art de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-night: #0b0c10;
            --wood-dark: #2c1e16;
            --wood-light: #4a3320;
            --fire-core: #fceabb;
            --fire-mid: #f8b500;
            --fire-edge: #fb8500;
            --parchment: #e2d1a7;
            --text-main: #fceabb;
            --text-muted: #a39171;
            --danger: #9d0208;
            --success: #386641;
            --nav-height: 70px;
        }

        body {
            font-family: 'VT323', monospace;
            background-color: var(--bg-night);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            padding-bottom: var(--nav-height);
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: none; /* Mejor renderizado para pixel art */
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(251, 133, 0, 0.15) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* --- ARTE DEL FUEGO Y CABALLERO (CSS Puro) --- */
        .tavern-scene {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 120px;
            margin-bottom: 10px;
            position: relative;
        }

        .fire-container {
            position: relative;
            width: 60px;
            height: 60px;
            animation: flickerLight 2s infinite alternate;
        }

        .log {
            position: absolute;
            bottom: 5px;
            width: 40px;
            height: 12px;
            background-color: var(--wood-dark);
            border: 2px solid #1a110c;
            border-radius: 4px;
        }
        .log.left { left: 0; transform: rotate(15deg); }
        .log.right { right: 0; transform: rotate(-15deg); }

        .flame {
            position: absolute;
            bottom: 15px;
            width: 30px;
            height: 30px;
            background-color: var(--fire-edge);
            border-radius: 50% 0 50% 50%;
            transform: rotate(-45deg);
            animation: burn 0.5s infinite alternate;
        }
        .flame.inner {
            bottom: 15px;
            left: 10px;
            width: 20px;
            height: 20px;
            background-color: var(--fire-mid);
            animation-delay: 0.2s;
        }
        .flame.core {
            bottom: 15px;
            left: 15px;
            width: 10px;
            height: 10px;
            background-color: var(--fire-core);
            animation-delay: 0.4s;
        }

        .knight {
            width: 40px;
            height: 50px;
            background-color: #4a4e69;
            margin-left: 20px;
            border-radius: 20px 20px 0 0;
            position: relative;
            box-shadow: -5px 0 15px rgba(251, 133, 0, 0.3); /* Luz del fuego refleja en armadura */
        }
        .knight::before { /* Casco */
            content: ''; position: absolute; top: 10px; left: 5px; right: 5px; height: 15px;
            background-color: #22223b; border-radius: 5px;
        }
        .knight::after { /* Ranura del ojo */
            content: ''; position: absolute; top: 15px; left: 10px; width: 10px; height: 3px;
            background-color: #0b0c10;
        }
        .z-sleep {
            position: absolute; top: -20px; right: -10px; font-size: 20px; color: var(--text-muted);
            animation: floatZ 2s infinite linear;
        }

        @keyframes burn {
            0% { transform: rotate(-45deg) scale(0.9); }
            100% { transform: rotate(-45deg) scale(1.1) translateY(-2px); }
        }
        @keyframes flickerLight {
            0% { filter: drop-shadow(0 0 15px var(--fire-edge)); }
            100% { filter: drop-shadow(0 0 25px var(--fire-mid)); }
        }
        @keyframes floatZ {
            0% { opacity: 0; transform: translateY(0) scale(0.8); }
            50% { opacity: 1; transform: translateY(-10px) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(1.2); }
        }

        /* --- TIPOGRAFÍA Y UI --- */
        h1 { font-size: 36px; margin: 0; text-align: center; text-transform: uppercase; letter-spacing: 2px; text-shadow: 2px 2px 0px #000; }
        p.subtitle { color: var(--text-muted); font-size: 20px; margin-top: 0; margin-bottom: 24px; text-align: center; }

        .stats-card {
            background-color: var(--wood-dark);
            border: 4px solid var(--wood-light);
            border-radius: 4px;
            padding: 16px;
            text-align: center;
            margin-bottom: 24px;
            box-shadow: inset 0 0 10px #000, 0 4px 6px rgba(0,0,0,0.5);
        }
        .stats-card h2 { margin: 0; font-size: 20px; color: var(--text-muted); text-transform: uppercase;}
        .stats-card .hours { font-size: 42px; color: var(--fire-mid); margin: 8px 0; text-shadow: 2px 2px #000; }
        .stats-card button {
            background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted);
            font-family: 'VT323', monospace; font-size: 16px; cursor: pointer; text-transform: uppercase;
        }

        .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .tab-btn {
            flex: 1; padding: 12px;
            background: var(--wood-dark); border: 4px outset var(--wood-light); color: var(--text-muted);
            font-family: 'VT323', monospace; font-size: 22px; cursor: pointer; text-transform: uppercase;
        }
        .tab-btn.active { background: var(--wood-light); border: 4px inset var(--wood-dark); color: var(--text-main); }

        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 4px; font-size: 22px; color: var(--parchment); text-shadow: 1px 1px #000;}
        
        /* CORRECCIÓN iOS: font-size 18px (mayor a 16px) evita zoom. */
        input[type="time"], input[type="number"] {
            -webkit-appearance: none;
            width: 100%; padding: 12px;
            background: #000; border: 2px solid var(--wood-light); color: var(--fire-mid);
            font-family: 'VT323', monospace; font-size: 24px; box-sizing: border-box; text-align: center;
        }
        input[type="time"]::-webkit-calendar-picker-indicator { filter: sepia(1) saturate(5) hue-rotate(330deg); }

        .calc-btn {
            width: 100%; padding: 16px; margin-top: 8px;
            background: var(--fire-edge); border: 4px outset var(--fire-mid); color: #000;
            font-family: 'VT323', monospace; font-size: 26px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; transition: transform 0.1s;
        }
        .calc-btn:active { transform: scale(0.98); border-style: inset; }

        .results-box {
            margin-top: 24px; padding: 16px;
            background: var(--parchment); border: 4px solid #8b7355; border-radius: 2px;
            color: #3e2723; box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
        }
        table { width: 100%; border-collapse: collapse; text-align: center; }
        th { color: #5d4037; font-size: 18px; border-bottom: 2px dashed #8b7355; padding-bottom: 8px; text-transform: uppercase; }
        td { padding: 10px 2px; font-size: 20px; border-bottom: 1px dotted #a1887f; }
        tr:last-child td { border-bottom: none; }
        
        .optimal { background-color: rgba(56, 102, 65, 0.2); font-weight: bold; font-size: 24px;}
        
        .save-btn {
            background: var(--success); border: 2px outset #52b788; color: white;
            font-family: 'VT323', monospace; font-size: 16px; cursor: pointer; text-transform: uppercase;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background: var(--wood-dark); border-top: 4px solid var(--wood-light);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); cursor: pointer; width: 33%; font-size: 18px; }
        .nav-item.active { color: var(--fire-mid); text-shadow: 0 0 5px var(--fire-edge); }

        .view { display: none; animation: fadeIn 0.3s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Toast medieval */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: var(--wood-dark); border: 2px solid var(--fire-mid); color: var(--fire-mid);
            padding: 12px 24px; font-size: 20px; z-index: 1000; box-shadow: 0 4px 12px #000;
            opacity: 0; pointer-events: none; transition: all 0.3s ease; text-transform: uppercase;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 22px; }

        /* Gráfico de barras estilo RPG */
        .chart-wrapper { background: var(--wood-dark); padding: 20px; border: 4px solid var(--wood-light); margin-top: 20px;}
        .chart-container { display: flex; align-items: flex-end; height: 200px; gap: 8px; overflow-x: auto; padding-bottom: 10px; }
        .bar-group { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 32px; }
        .bar { width: 24px; transition: height 0.5s ease; border: 2px solid #000; }
        .bar.good { background-color: var(--success); }
        .bar.ok { background-color: var(--fire-mid); }
        .bar.bad { background-color: var(--danger); }
        .bar-label { font-size: 16px; color: var(--text-muted); margin-top: 8px; }
        
        .history-card {
            background: var(--parchment); border: 2px solid #8b7355; padding: 12px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center; color: #3e2723;
        }
        .delete-btn { background: var(--danger); color: white; border: 2px outset #ff0000; font-family: 'VT323'; cursor: pointer;}
    </style>
</head>
<body>

    <div id="toast" class="toast">Mensaje</div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('calc')" id="nav-calc">
            <span>🔥</span><span>Posada</span>
        </div>
        <div class="nav-item" onclick="switchView('history')" id="nav-history">
            <span>📜</span><span>Bitácora</span>
        </div>
        <div class="nav-item" onclick="switchView('stats')" id="nav-stats">
            <span>⚔️</span><span>Crónicas</span>
        </div>
    </div>

    <!-- VISTA 1: CALCULADORA (LA POSADA) -->
    <div id="view-calc" class="app-container view active">
        
        <div class="tavern-scene">
            <div class="fire-container">
                <div class="log left"></div>
                <div class="log right"></div>
                <div class="flame"></div>
                <div class="flame inner"></div>
                <div class="flame core"></div>
            </div>
            <div class="knight">
                <div class="z-sleep">Zz</div>
            </div>
        </div>

        <h1>Reposo del Guerrero</h1>
        <p class="subtitle">Recupera salud (Ciclos de 90m)</p>

        <div class="tabs">
            <button id="wake-tab" class="tab-btn active" onclick="setMode('wake')">Gallo canta</button>
            <button id="sleep-tab" class="tab-btn" onclick="setMode('sleep')">Pernoctar</button>
        </div>

        <div class="input-group">
            <label id="time-label">Deseo despertar a las:</label>
            <input type="time" id="time-input" required>
        </div>

        <div class="input-group">
            <label>Minutos para apagar la vela (latencia):</label>
            <input type="number" id="latency-input" value="20" min="0" max="120">
        </div>

        <button class="calc-btn" onclick="calcularCiclos()">Consultar Oráculos</button>

        <div id="results-table" class="results-box" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Ciclos</th>
                        <th>Reposo</th>
                        <th>Reloj de Arena</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>

    <!-- VISTA 2: HISTORIAL (BITÁCORA DIARIA) -->
    <div id="view-history" class="app-container view">
        <h1>Bitácora de Reposo</h1>
        <p class="subtitle">Tus noches de los últimos 7 soles.</p>
        <div id="history-container"></div>
    </div>

    <!-- VISTA 3: ESTADÍSTICAS (CRÓNICAS) -->
    <div id="view-stats" class="app-container view">
        <h1>Crónicas Mensuales</h1>
        <p class="subtitle">Salud recuperada en 30 lunas.</p>
        
        <div class="stats-card">
            <h2>Horas reposadas (Semana actual)</h2>
            <div class="hours" id="weekly-hours">0h 0m</div>
        </div>

        <div class="chart-wrapper">
            <div class="chart-container" id="chart-container"></div>
        </div>
        <button onclick="limpiarBaseDeDatos()" style="margin-top: 20px; width: 100%; padding: 12px; background: transparent; border: 2px solid var(--danger); color: var(--danger); font-family: 'VT323'; font-size: 20px; cursor: pointer; text-transform: uppercase;">Quemar Crónicas (Borrar datos)</button>
    </div>

    <script>
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');
            document.getElementById(`nav-${viewId}`).classList.add('active');
            
            if (viewId === 'history') renderHistory();
            if (viewId === 'stats') { renderChart(); updateWeeklyStats(); }
        }

        function setMode(mode) {
            const wakeTab = document.getElementById('wake-tab');
            const sleepTab = document.getElementById('sleep-tab');
            const timeLabel = document.getElementById('time-label');

            if (mode === 'wake') {
                wakeTab.classList.add('active'); sleepTab.classList.remove('active');
                timeLabel.textContent = 'Deseo despertar a las:';
            } else {
                sleepTab.classList.add('active'); wakeTab.classList.remove('active');
                timeLabel.textContent = 'Apago el fuego a las:';
            }
            document.getElementById('results-table').style.display = 'none';
        }

        function formatTime(date) { return date.getHours().toString().padStart(2, '0') + ':' + date.getMinutes().toString().padStart(2, '0'); }

        function calcularCiclos() {
            const isWakeUp = document.getElementById('wake-tab').classList.contains('active');
            const timeInput = document.getElementById('time-input').value;
            const latencyInput = parseInt(document.getElementById('latency-input').value) || 0;
            
            if (!timeInput) return showToast('¡Falta indicar la hora en el reloj de sol!');

            const [hours, minutes] = timeInput.split(':').map(Number);
            const baseDate = new Date(); baseDate.setHours(hours, minutes, 0, 0);

            const tbody = document.getElementById('results-body'); tbody.innerHTML = '';
            document.getElementById('results-table').style.display = 'block';

            for (let i = 1; i <= 6; i++) {
                const sleepDurationMins = i * 90; const targetDate = new Date(baseDate);
                let bedtimeStr = ""; 
                if (isWakeUp) {
                    targetDate.setMinutes(targetDate.getMinutes() - sleepDurationMins - latencyInput);
                    bedtimeStr = formatTime(targetDate);
                } else {
                    bedtimeStr = formatTime(baseDate);
                    targetDate.setMinutes(targetDate.getMinutes() + sleepDurationMins + latencyInput);
                }

                const totalMins = sleepDurationMins + latencyInput;
                const hrs = Math.floor(totalMins / 60); const mins = totalMins % 60;
                const row = document.createElement('tr');
                if (i >= 4 && i <= 6) row.classList.add('optimal');

                row.innerHTML = `
                    <td>${i}</td>
                    <td>${hrs}h ${mins}m</td>
                    <td style="font-size: 24px; font-weight: bold; color: #5d4037;">${formatTime(targetDate)}</td>
                    <td><button class="save-btn" onclick="saveRecord(${totalMins}, '${bedtimeStr}')">+ Sellar</button></td>
                `;
                tbody.appendChild(row);
            }
        }

        // --- SISTEMA DE ALMACENAMIENTO ---
        function getDB() { const data = localStorage.getItem('sleepLoreDB'); return data ? JSON.parse(data) : []; }
        function saveDB(data) { localStorage.setItem('sleepLoreDB', JSON.stringify(data)); }

        function saveRecord(minutes, bedtime) {
            const db = getDB(); const now = new Date();
            db.push({
                id: Date.now().toString(), timestamp: now.getTime(),
                dateStr: now.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }),
                bedtime: bedtime, minutes: minutes
            });
            saveDB(db); showToast("¡Registro sellado en los pergaminos!");
        }

        function deleteRecord(id) {
            let db = getDB(); db = db.filter(record => record.id !== id);
            saveDB(db); renderHistory(); renderChart(); updateWeeklyStats();
            showToast("Pergamino quemado.");
        }

        function limpiarBaseDeDatos() {
            if(confirm("¿Quemar todas las crónicas? Esta acción es irreversible.")) {
                localStorage.removeItem('sleepLoreDB'); renderHistory(); renderChart(); updateWeeklyStats();
                showToast("Cenizas dispersadas.");
            }
        }

        function updateWeeklyStats() {
            const db = getDB(); const hace7Dias = new Date().getTime() - (7 * 24 * 60 * 60 * 1000);
            const recientes = db.filter(r => r.timestamp >= hace7Dias);
            let totalMins = 0; recientes.forEach(r => totalMins += r.minutes);
            document.getElementById('weekly-hours').innerText = `${Math.floor(totalMins / 60)}h ${totalMins % 60}m`;
        }

        function renderHistory() {
            const db = getDB(); const container = document.getElementById('history-container'); container.innerHTML = '';
            const hace7Dias = new Date().getTime() - (7 * 24 * 60 * 60 * 1000);
            const recientes = db.filter(r => r.timestamp >= hace7Dias).sort((a,b) => b.timestamp - a.timestamp);

            if (recientes.length === 0) {
                container.innerHTML = '<div class="empty-state">No has escrito nada en los últimos 7 soles. ¡Sella tus ciclos en la posada!</div>';
                return;
            }

            recientes.forEach(record => {
                container.innerHTML += `
                    <div class="history-card">
                        <div>
                            <div style="font-size:22px; font-weight:bold;">${record.dateStr}</div>
                            <div style="font-size:16px;">Apagaste llama: ${record.bedtime}</div>
                        </div>
                        <div style="display:flex; align-items:center;">
                            <div style="font-size:26px; font-weight:bold; color:var(--success); margin-right:10px;">
                                ${Math.floor(record.minutes / 60)}h ${record.minutes % 60}m
                            </div>
                            <button class="delete-btn" onclick="deleteRecord('${record.id}')">X</button>
                        </div>
                    </div>
                `;
            });
        }

        function renderChart() {
            const db = getDB(); const container = document.getElementById('chart-container'); container.innerHTML = '';
            const hace30Dias = new Date().getTime() - (30 * 24 * 60 * 60 * 1000);
            const recientes = db.filter(r => r.timestamp >= hace30Dias);
            
            if (recientes.length === 0) { container.innerHTML = '<div class="empty-state">Sin crónicas suficientes.</div>'; return; }

            const grouped = {};
            recientes.forEach(r => { if(!grouped[r.dateStr]) grouped[r.dateStr] = 0; grouped[r.dateStr] += r.minutes; });

            const MAX_MINUTES = 720; // 12 horas máx
            Object.keys(grouped).forEach(date => {
                const mins = grouped[date]; let heightPercent = (mins / MAX_MINUTES) * 100; if (heightPercent > 100) heightPercent = 100;
                let colorClass = 'bad'; if (mins >= 360 && mins < 450) colorClass = 'ok'; if (mins >= 450) colorClass = 'good';
                
                container.innerHTML += `
                    <div class="bar-group">
                        <div class="bar ${colorClass}" style="height: ${heightPercent}%;"></div>
                        <div class="bar-label" style="font-family:'VT323'">${date.split(',')[0]}</div>
                    </div>
                `;
            });
            setTimeout(() => { container.scrollLeft = container.scrollWidth; }, 100);
        }

        window.onload = () => {
            const now = new Date();
            document.getElementById('time-input').value = formatTime(now);
            updateWeeklyStats();
        };
    </script>
</body>
</html>
