<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Etiquetas PWA para iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>A la Luz del Fogón</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">

    <!-- Tipografía: Rye (títulos y señalética) + Space Mono (datos y texto) -->
    <link href="https://fonts.googleapis.com/css2?family=Rye&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="toast" class="toast">Mensaje</div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchView('calc')" id="nav-calc">
            <span class="icon">🔥</span><span>Fogón</span>
        </div>
        <div class="nav-item" onclick="switchView('history')" id="nav-history">
            <span class="icon">📓</span><span>Cuaderno de Ruta</span>
        </div>
        <div class="nav-item" onclick="switchView('stats')" id="nav-stats">
            <span class="icon">🌙</span><span>Recuento</span>
        </div>
    </div>

    <!-- VISTA 1: CALCULADORA (EL FOGÓN) -->
    <div id="view-calc" class="app-container view active">

        <div class="scene">
            <div class="star" style="top:14px; left:18%;"></div>
            <div class="star" style="top:28px; left:32%; animation-delay:0.6s;"></div>
            <div class="star" style="top:10px; left:62%; animation-delay:1.1s;"></div>
            <div class="star" style="top:34px; left:78%; animation-delay:1.7s;"></div>
            <div class="star" style="top:20px; left:48%; animation-delay:2.2s;"></div>
            <div class="moon"></div>
            <div class="fogon-group">
                <div class="fire-container">
                    <div class="log left"></div>
                    <div class="log right"></div>
                    <div class="flame"></div>
                    <div class="flame inner"></div>
                    <div class="flame core"></div>
                </div>
                <div class="gaucho">
                    <div class="hat-brim"></div>
                    <div class="hat-crown"></div>
                    <div class="poncho"></div>
                    <div class="z-sleep">Zz</div>
                </div>
            </div>
        </div>

        <h1>A la Luz del Fogón</h1>
        <p class="subtitle">Rearmá el cuero. Ciclos de sueño de 90 minutos.</p>

        <div class="tabs">
            <button id="wake-tab" class="tab-btn active" onclick="setMode('wake')">Al Alba</button>
            <button id="sleep-tab" class="tab-btn" onclick="setMode('sleep')">Al Pago</button>
        </div>

        <div class="input-group">
            <label id="time-label">Quiero levantarme con el sol a las:</label>
            <input type="time" id="time-input" required>
        </div>

        <div class="input-group">
            <label>Minutos hasta que se me cierren los ojos:</label>
            <input type="number" id="latency-input" value="20" min="0" max="120">
        </div>

        <button class="calc-btn" onclick="calcularCiclos()">Marcar el Rumbo</button>

        <div id="results-table" class="results-box" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Ciclos</th>
                        <th>Reposo</th>
                        <th>Hora</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>

    <!-- VISTA 2: HISTORIAL (CUADERNO DE RUTA) -->
    <div id="view-history" class="app-container view">
        <h1>Cuaderno de Ruta</h1>
        <p class="subtitle">Tus noches de los últimos 7 soles.</p>
        <div id="history-container"></div>
    </div>

    <!-- VISTA 3: ESTADÍSTICAS (RECUENTO) -->
    <div id="view-stats" class="app-container view">
        <h1>Recuento de 30 Lunas</h1>
        <p class="subtitle">Salud recuperada en 30 lunas.</p>

        <div class="stats-card">
            <h2>Horas reposadas (Semana actual)</h2>
            <div class="hours" id="weekly-hours">0h 0m</div>
        </div>

        <div class="chart-wrapper">
            <div class="chart-container" id="chart-container"></div>
        </div>
        <button class="btn-danger" onclick="limpiarBaseDeDatos()">Borrar el Rastro (borrar datos)</button>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
