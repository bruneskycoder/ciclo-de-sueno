<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>Prueba de la escena pintada</title>
        <!--
            Página suelta, fuera del build (igual que escena-prototipo.html).
            Tiene que abrirse por http y no con doble clic: leer los píxeles
            de la pintura para moverlos no anda desde file://.
              - con `npm run dev`:  /ciclo-de-sueno/escena-pintada.html
              - sin instalar nada:  python3 -m http.server  y  /escena-pintada.html

            Parámetros de la URL, solo para probar:
              ?ajuste=cubrir   llena la pantalla recortando los costados
              ?movimiento=no   todo quieto (también si el teléfono lo pide)
              ?t=3.5           congela la animación en ese segundo
              ?mascara=1       marca dónde actúan el viento y la llama
        -->
        <style>
            :root {
                /* Colores de la fila de arriba y de la de abajo de la pintura:
                   extienden el cielo y el suelo cuando la pantalla es más
                   alta que 9:16, sin que se vea el empalme. */
                --cielo: #0c142a;
                --suelo: #1e1417;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: linear-gradient(
                    to bottom,
                    var(--cielo) 50%,
                    var(--suelo) 50%
                );
            }
            canvas {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                /* Ajuste por ancho, sin pasarse de alto en pantallas anchas. */
                width: min(100vw, calc(100dvh * 572 / 1024));
                aspect-ratio: 572 / 1024;
                image-rendering: pixelated;
                /* Difumina el borde de arriba y el de abajo contra el fondo. */
                -webkit-mask-image: linear-gradient(
                    to bottom,
                    transparent,
                    #000 28px,
                    #000 calc(100% - 28px),
                    transparent
                );
                mask-image: linear-gradient(
                    to bottom,
                    transparent,
                    #000 28px,
                    #000 calc(100% - 28px),
                    transparent
                );
            }
            body.cubrir canvas {
                width: max(100vw, calc(100dvh * 572 / 1024));
                -webkit-mask-image: none;
                mask-image: none;
            }
            #error {
                position: absolute;
                inset: 0;
                display: none;
                align-items: center;
                justify-content: center;
                color: #e8dcc4;
                font: 16px/1.4 system-ui, sans-serif;
            }
        </style>
    </head>
    <body>
        <canvas id="escena" width="572" height="1024"></canvas>
        <div id="error">No pude cargar la pintura.</div>
        <script type="module">
            // ---------------------------------------------------------------
            // Medidas tomadas sobre public/escena/noche.png (572 × 1024).
            // Todo está en píxeles de la pintura, no de la pantalla.
            // ---------------------------------------------------------------
            const W = 572;
            const H = 1024;
            const IMAGEN = './src/assets/escena/noche.webp';

            const FUEGO = { x: 292, yBase: 606, yPunta: 518 };

            // Zonas que se mueven con el viento. `punta` es lo más alto de la
            // copa o del pasto y `base` donde se agarra al suelo: el
            // desplazamiento vale cero en la base y crece hacia la punta, para
            // que troncos y suelo no resbalen.
            const VIENTO = [
                { x0: 0, x1: 180, punta: 192, base: 330, amp: 4, fase: 0.0 },
                { x0: 148, x1: 200, punta: 232, base: 320, amp: 3, fase: 1.3 },
                { x0: 200, x1: 292, punta: 244, base: 320, amp: 3, fase: 2.1 },
                { x0: 345, x1: 402, punta: 262, base: 300, amp: 2, fase: 0.7 },
                { x0: 500, x1: 572, punta: 700, base: 790, amp: 2, fase: 0.4 },
                { x0: 428, x1: 462, punta: 702, base: 738, amp: 1.5, fase: 1.8 },
                { x0: 55, x1: 180, punta: 705, base: 765, amp: 1, fase: 2.6 },
                { x0: 205, x1: 270, punta: 765, base: 805, amp: 1, fase: 0.9 },
                { x0: 470, x1: 572, punta: 600, base: 645, amp: 1, fase: 1.1 },
            ];

            // Caja donde se deforma la llama pintada. Se corta en x=322 porque
            // ahí está el palenque, que no tiene que moverse.
            const CAJA = { x0: 246, x1: 322, y0: 500, y1: 612 };

            // Posiciones de las estrellas más claras de la pintura, repartidas
            // por todo el cielo; ritmo y fase de cada una salen de su número,
            // así ninguna titila al mismo tiempo que otra.
            const ESTRELLAS = [
                [328, 56], [353, 82], [301, 81], [526, 40], [144, 16], [557, 9],
                [475, 58], [178, 107], [466, 103], [421, 127], [21, 135],
                [218, 135], [478, 147], [244, 11], [417, 28], [176, 45],
            ].map(([x, y], i) => ({
                x,
                y,
                w: 0.9 + ((i * 37) % 17) / 8,
                fase: (i * 2.399) % (Math.PI * 2),
            }));

            // ---------------------------------------------------------------
            const q = new URLSearchParams(location.search);
            if (q.get('ajuste') === 'cubrir') document.body.classList.add('cubrir');
            const tFijo = q.has('t') ? Number(q.get('t')) : null;
            const quieto =
                q.get('movimiento') === 'no' ||
                matchMedia('(prefers-reduced-motion: reduce)').matches;
            const mostrarMascara = q.get('mascara') === '1';

            const vista = document.getElementById('escena');
            const ctx = vista.getContext('2d');
            ctx.imageSmoothingEnabled = false;

            // La pintura limpia vive en un canvas aparte: solo se reescriben
            // las zonas que se mueven. Todo lo que es luz, brasas, humo y
            // estrellas se dibuja encima en cada cuadro y no ensucia la base.
            const base = document.createElement('canvas');
            base.width = W;
            base.height = H;
            const baseCtx = base.getContext('2d');

            function cargar(url) {
                return new Promise((ok, mal) => {
                    const img = new Image();
                    img.onload = () => ok(img);
                    img.onerror = mal;
                    img.src = url;
                });
            }

            const rnd = (s) => {
                // Pseudoaleatorio fijo: mismas brasas en cada recarga, así una
                // captura con ?t= se puede comparar con otra.
                const x = Math.sin(s * 127.1 + 311.7) * 43758.5453;
                return x - Math.floor(x);
            };
            const limitar = (v, a, b) => Math.min(b, Math.max(a, v));

            try {
                const img = await cargar(IMAGEN);
                baseCtx.drawImage(img, 0, 0);
            } catch {
                document.getElementById('error').style.display = 'flex';
                throw new Error('No cargó ' + IMAGEN);
            }

            const original = baseCtx.getImageData(0, 0, W, H);
            const src = new Uint32Array(original.data.buffer);
            const salida = new ImageData(new Uint8ClampedArray(original.data), W, H);
            const dst = new Uint32Array(salida.data.buffer);

            // ---------------- llama: 4 cuadros derivados de la pintura -----
            // En vez de dibujar una llama aparte, que desentonaría con la
            // pintura, se deforma la llama pintada: se inclina la punta, se
            // ondula y se estira o se achica. Se calculan una sola vez.
            const CUADROS_LLAMA = [
                { s: 1.0, inclina: -2, fase: 0.7 },
                { s: 0.94, inclina: 1, fase: 2.3 },
                { s: 1.05, inclina: 2, fase: 3.9 },
                { s: 0.98, inclina: -1, fase: 5.4 },
            ];
            // Orden fijo pero no a la vuelta, para que no se note el ciclo.
            const SECUENCIA_LLAMA = [0, 1, 2, 3, 1, 3, 0, 2, 3, 1, 0, 2];

            function armarCuadroLlama({ s, inclina, fase }) {
                const w = CAJA.x1 - CAJA.x0;
                const h = CAJA.y1 - CAJA.y0;
                const datos = new Uint8ClampedArray(w * h * 4);
                const px = new Uint32Array(datos.buffer);
                for (let y = CAJA.y0; y < CAJA.y1; y++) {
                    // 0 en la base de la llama (los leños no se mueven), 1 en
                    // la punta.
                    const alto = limitar((590 - y) / 72, 0, 1);
                    const arriba = limitar((y - CAJA.y0) / 20, 0, 1);
                    const sEf = 1 + (s - 1) * arriba;
                    const ySrc = Math.round(y < 590 ? 590 - (590 - y) * sEf : y);
                    const corrim = Math.round(
                        2.6 * Math.pow(alto, 1.1) * Math.sin(fase + y * 0.13) +
                            inclina * alto * alto,
                    );
                    for (let x = CAJA.x0; x < CAJA.x1; x++) {
                        // El corrimiento se apaga hacia los bordes de la caja
                        // para que no quede un escalón contra lo de afuera.
                        const peso = limitar(
                            Math.min(x - CAJA.x0, CAJA.x1 - x) / 10,
                            0,
                            1,
                        );
                        const xSrc = limitar(
                            x - Math.round(corrim * peso),
                            CAJA.x0,
                            CAJA.x1 - 1,
                        );
                        px[(y - CAJA.y0) * w + (x - CAJA.x0)] = src[ySrc * W + xSrc];
                    }
                }
                return new ImageData(datos, w, h);
            }
            const llama = CUADROS_LLAMA.map(armarCuadroLlama);

            // ---------------- viento -------------------------------------
            const ultimoViento = VIENTO.map(() => new Int8Array(H));

            // Ráfaga lenta más un vaivén; el resultado se redondea a píxeles
            // enteros. Probado a ojo en el prototipo 3D: con fracciones de
            // píxel todo tiembla y parece un error de la imagen.
            function viento(t, fase) {
                const rafaga = 0.5 + 0.5 * Math.sin(t * 0.45 + fase);
                const vaiven = Math.sin(t * 1.5 + fase + 0.8 * Math.sin(t * 0.37));
                return (0.35 + 0.65 * rafaga) * vaiven;
            }

            function aplicarViento(t) {
                VIENTO.forEach((z, i) => {
                    const mod = viento(t, z.fase);
                    const memo = ultimoViento[i];
                    let cambio = false;
                    for (let y = z.punta; y <= z.base; y++) {
                        const alto = Math.pow((z.base - y) / (z.base - z.punta), 1.5);
                        const dx = Math.round(z.amp * alto * mod);
                        if (dx === memo[y]) continue;
                        memo[y] = dx;
                        cambio = true;
                        for (let x = z.x0; x < z.x1; x++) {
                            const xs = limitar(x - dx, z.x0, z.x1 - 1);
                            dst[y * W + x] = src[y * W + xs];
                        }
                    }
                    if (cambio) {
                        baseCtx.putImageData(
                            salida,
                            0,
                            0,
                            z.x0,
                            z.punta,
                            z.x1 - z.x0,
                            z.base - z.punta + 1,
                        );
                    }
                });
            }

            // ---------------- luz del fuego -------------------------------
            // Escalones de resplandor alrededor del fogón. Cada anillo es una
            // elipse chata (la luz cae sobre el suelo) y se suma a lo pintado.
            // El titileo sube y baja el conjunto de a saltos, no suave.
            function titileo(t) {
                const n =
                    Math.sin(t * 11) * 0.5 +
                    Math.sin(t * 17.3 + 1) * 0.3 +
                    Math.sin(t * 5.1 + 2) * 0.2;
                return Math.round(n * 3) / 3; // cuatro o cinco niveles
            }

            function dibujarLuz(t) {
                const n = titileo(t);
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                const cx = FUEGO.x;
                const cy = 592;
                for (let k = 0; k < 6; k++) {
                    const rx = Math.round((60 + k * 28) * (1 + 0.04 * n) / 2) * 2;
                    ctx.fillStyle = `rgba(255,140,40,${0.03 * (1 + 0.25 * n)})`;
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rx, rx * 0.62, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            // ---------------- brasas y humo -------------------------------
            // Cada partícula es función pura del tiempo: no guarda estado, y
            // por eso ?t= devuelve siempre el mismo cuadro.
            function dibujarBrasas(t) {
                for (let i = 0; i < 16; i++) {
                    const periodo = 2.2 + rnd(i + 1) * 2.4;
                    const u = (t / periodo + rnd(i + 50)) % 1;
                    const alto = 70 + rnd(i + 9) * 85;
                    const x =
                        FUEGO.x +
                        (rnd(i + 20) - 0.5) * 22 +
                        Math.sin(t * 1.7 + i) * 6 * u +
                        viento(t, 0.4) * 12 * u;
                    const y = FUEGO.yBase - 12 - u * alto;
                    ctx.globalAlpha = Math.min(1, (1 - u) * 1.6);
                    ctx.fillStyle = u < 0.45 ? '#ffb640' : u < 0.75 ? '#e0701c' : '#8a2f1f';
                    const lado = rnd(i + 70) > 0.8 ? 2 : 1;
                    ctx.fillRect(Math.round(x), Math.round(y), lado, lado);
                }
                ctx.globalAlpha = 1;
            }

            function dibujarHumo(t) {
                for (let i = 0; i < 5; i++) {
                    const periodo = 5 + rnd(i + 90) * 2.5;
                    const u = (t / periodo + i / 5) % 1;
                    const cx = FUEGO.x + 4 + u * 34 + Math.sin(t * 0.8 + i * 2) * 5 + viento(t, 0.4) * 10 * u;
                    const cy = FUEGO.yPunta - 4 - u * 120;
                    const r = 4 + u * 15;
                    ctx.globalAlpha = 0.2 * Math.min(1, u * 5) * (1 - u);
                    ctx.fillStyle = '#7d93b0';
                    // Disco con trama de tablero: parece humo y no una mancha
                    // lisa, y queda en la grilla de píxeles de la pintura.
                    for (let dy = -r; dy <= r; dy += 2) {
                        for (let dx = -r; dx <= r; dx += 2) {
                            if (dx * dx + dy * dy > r * r) continue;
                            if (((dx + dy) / 2) & 1) continue;
                            ctx.fillRect(Math.round(cx + dx), Math.round(cy + dy), 2, 2);
                        }
                    }
                }
                ctx.globalAlpha = 1;
            }

            // ---------------- estrellas -----------------------------------
            function dibujarEstrellas(t) {
                for (const e of ESTRELLAS) {
                    const v = Math.sin(t * e.w + e.fase);
                    if (v > 0.4) {
                        // Brillo: cuatro puntas de un píxel.
                        ctx.fillStyle = 'rgba(232,220,196,0.9)';
                        ctx.fillRect(e.x - 2, e.y, 5, 1);
                        ctx.fillRect(e.x, e.y - 2, 1, 5);
                    } else if (v < -0.5) {
                        // Apagada: se tapa con el color de cielo de al lado.
                        const c = src[(e.y + 4) * W + (e.x + 5)];
                        ctx.fillStyle = `rgb(${c & 255},${(c >> 8) & 255},${(c >> 16) & 255})`;
                        ctx.fillRect(e.x - 2, e.y - 2, 5, 5);
                    }
                }
            }

            // ---------------- marcas de prueba ----------------------------
            function dibujarMascara() {
                ctx.lineWidth = 1;
                ctx.strokeStyle = 'rgba(255,60,60,0.9)';
                for (const z of VIENTO) {
                    ctx.strokeRect(z.x0 + 0.5, z.punta + 0.5, z.x1 - z.x0, z.base - z.punta);
                }
                ctx.strokeStyle = 'rgba(60,255,120,0.9)';
                ctx.strokeRect(CAJA.x0 + 0.5, CAJA.y0 + 0.5, CAJA.x1 - CAJA.x0, CAJA.y1 - CAJA.y0);
                ctx.strokeStyle = 'rgba(255,255,60,0.9)';
                for (const e of ESTRELLAS) ctx.strokeRect(e.x - 3.5, e.y - 3.5, 7, 7);
            }

            // ---------------- cuadro --------------------------------------
            let cuadroLlama = -1;
            function dibujar(t) {
                const k = SECUENCIA_LLAMA[Math.floor(t * 8) % SECUENCIA_LLAMA.length];
                if (k !== cuadroLlama) {
                    cuadroLlama = k;
                    baseCtx.putImageData(llama[k], CAJA.x0, CAJA.y0);
                }
                aplicarViento(t);

                ctx.globalCompositeOperation = 'source-over';
                ctx.drawImage(base, 0, 0);
                dibujarLuz(t);
                dibujarHumo(t);
                dibujarBrasas(t);
                dibujarEstrellas(t);
                if (mostrarMascara) dibujarMascara();
            }

            // Tope de 30 cuadros por segundo: la pintura no gana nada con más
            // y el teléfono gasta menos batería.
            const INTERVALO = 1000 / 30;
            if (tFijo !== null || quieto) {
                dibujar(tFijo ?? 0);
            } else {
                const inicio = performance.now();
                let ultimo = -Infinity;
                const paso = (ahora) => {
                    requestAnimationFrame(paso);
                    if (ahora - ultimo < INTERVALO - 2) return;
                    ultimo = ahora;
                    dibujar((ahora - inicio) / 1000);
                };
                requestAnimationFrame(paso);
            }
            window.__lista = true;
        </script>
    </body>
</html>
